<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article dir="rtl" style="display:flex;flex-direction:column;gap:12px;min-width:0;font-family:'Assistant',sans-serif;color:#111">
  <div onClick="{{ p.onOpen }}" style="position:relative;aspect-ratio:1/1.1;background:#F4F4F2;overflow:hidden;cursor:pointer">
    <sc-if value="{{ p.hasImg }}" hint-placeholder-val="{{ false }}">
      <img src="{{ p.img }}" alt="{{ p.name }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;transition:transform .8s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.05)">
    </sc-if>
    <sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;font-family:'Karantina',sans-serif;font-weight:700;font-size:clamp(34px,4vw,52px);line-height:.9;color:#D2D2CD;transition:color .4s" style-hover="color:#BDBDB7">{{ p.ph }}</div>
    </sc-if>
    <div style="position:absolute;top:10px;right:10px;display:flex;flex-direction:column;align-items:flex-start;gap:4px">
      <sc-if value="{{ p.hasDeal }}" hint-placeholder-val="{{ false }}"><span style="background:#FFD100;color:#111;font-size:13px;font-weight:800;padding:4px 9px;line-height:1.2">{{ p.dealLabel }}</span></sc-if>
      <sc-if value="{{ p.isSale }}" hint-placeholder-val="{{ false }}"><span style="background:#111;color:#fff;font-size:13px;font-weight:700;padding:4px 9px;line-height:1.2;direction:ltr">{{ p.badge }}</span></sc-if>
      <sc-if value="{{ p.isBest }}" hint-placeholder-val="{{ false }}"><span style="background:#fff;color:#111;font-size:12px;font-weight:700;padding:4px 9px;line-height:1.2">רב מכר</span></sc-if>
    </div>
    <sc-if value="{{ p.showQuick }}" hint-placeholder-val="{{ true }}">
      <button aria-label="הוספה מהירה לסל" onClick="{{ p.onQuick }}" style="position:absolute;bottom:0;left:0;width:46px;height:46px;background:#fff;color:#111;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,color .2s" style-hover="background:#111;color:#fff">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </sc-if>
  </div>
  <div style="display:flex;flex-direction:column;gap:5px">
    <h3 onClick="{{ p.onOpen }}" style="font-size:15px;font-weight:600;line-height:1.35;margin:0;cursor:pointer;text-wrap:pretty">{{ p.name }}</h3>
    <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
      <span style="font-weight:800;font-size:17px">{{ p.priceLabel }}</span>
      <sc-if value="{{ p.hasCompare }}" hint-placeholder-val="{{ false }}"><s style="color:#8A8A86;font-size:14px">{{ p.compareLabel }}</s></sc-if>
    </div>
    <div style="display:flex;align-items:center;gap:8px;min-height:14px">
      <div style="display:flex;gap:4px">
        <sc-for list="{{ p.swatches }}" as="sw" hint-placeholder-count="3"><span style="width:12px;height:12px;border-radius:50%;background:{{ sw.hex }};box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)"></span></sc-for>
      </div>
      <span style="font-size:13px;color:#5E5E5B">{{ p.colorCount }}</span>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:460},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
