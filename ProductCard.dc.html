<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="display:flex;flex-direction:column;gap:12px;min-width:0;font-family:'IBM Plex Sans Hebrew',sans-serif;color:#1B1B19;direction:rtl">
  <div onClick="{{ p.onOpen }}" style="position:relative;aspect-ratio:4/5;background:#EAE7E1;border-radius:4px;overflow:hidden;cursor:pointer">
    <sc-if value="{{ p.hasImg }}" hint-placeholder-val="{{ false }}">
      <img src="{{ p.img }}" alt="{{ p.name }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;transition:transform .7s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.045)">
    </sc-if>
    <sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.12em;color:#8C897F;transition:background .4s" style-hover="background:#E3DFD7">{{ p.ph }}</div>
    </sc-if>
    <sc-if value="{{ p.isSale }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;top:10px;right:10px;background:#B9481A;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;padding:4px 8px;border-radius:2px;direction:ltr">{{ p.badge }}</span>
    </sc-if>
    <sc-if value="{{ p.isBest }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;top:10px;right:10px;background:#fff;color:#1B1B19;font-size:12px;font-weight:500;padding:4px 8px;border-radius:2px">רב מכר</span>
    </sc-if>
    <sc-if value="{{ p.showQuick }}" hint-placeholder-val="{{ true }}">
      <button aria-label="הוספה מהירה לסל" onClick="{{ p.onQuick }}" style="position:absolute;bottom:10px;left:10px;width:44px;height:44px;border-radius:50%;background:#fff;color:#1B1B19;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,color .2s" style-hover="background:#1B1B19;color:#fff">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </sc-if>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;padding:0 2px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:14px">
      <div style="display:flex;align-items:center;gap:5px">
        <sc-for list="{{ p.swatches }}" as="sw" hint-placeholder-count="3">
          <span style="width:11px;height:11px;border-radius:50%;background:{{ sw.hex }};box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)"></span>
        </sc-for>
        <sc-if value="{{ p.hasMore }}" hint-placeholder-val="{{ false }}"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6E6B64;direction:ltr">{{ p.more }}</span></sc-if>
      </div>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:#6E6B64;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.meta }}</span>
    </div>
    <h3 onClick="{{ p.onOpen }}" style="font-size:15px;font-weight:500;line-height:1.4;margin:0;cursor:pointer;text-wrap:pretty">{{ p.name }}</h3>
    <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
      <span style="font-weight:600;font-size:16px">{{ p.priceLabel }}</span>
      <sc-if value="{{ p.hasCompare }}" hint-placeholder-val="{{ false }}"><s style="color:#6E6B64;font-size:13px">{{ p.compareLabel }}</s></sc-if>
    </div>
    <sc-if value="{{ p.hasDeal }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:#A13E14">
        <span style="width:6px;height:6px;background:#B9481A;flex:none"></span>{{ p.dealLabel }}
      </div>
    </sc-if>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:460},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
